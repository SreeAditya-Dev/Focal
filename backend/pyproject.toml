[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "focal-backend"
version = "0.1.0"
description = "Focal — Image Quality & Defect Detection FastAPI Backend"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "python-multipart>=0.0.9",
    "pillow>=10.2.0",
    "torch>=2.1",
    "torchvision>=0.16",
    "focal-ml",
]

[project.optional-dependencies]
postgres = [
    "psycopg2-binary>=2.9.9",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[tool.uv.sources]
focal-ml = { path = "../ml_pipeline", editable = true }

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
